version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=password
      - JWT_SECRET=secret

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      - SERVER_URI=ws://server:8000/rat
    depends_on:
      - server

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - SERVER_URI=ws://server:8000/rat
    depends_on:
      - server
